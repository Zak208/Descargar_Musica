# Comprobaciones en cada subida y en cada propuesta de cambios: errores de código y todas las pruebas automáticas.
name: Comprobar el código

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Análisis del código (ruff)
        run: ruff check ui services config.py main.py version.py

      - name: Pruebas automáticas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python dev_tools/ejecutar_pruebas.py
