# Al subir una etiqueta «vX.Y.Z» se compila el .exe en Windows, se comprueba con --selftest y se publica
# como una versión (Release) en GitHub con el .zip adjunto, para descargarlo sin instalar Python.
# FFmpeg no se incluye (la aplicación lo descarga sola la primera vez): así el archivo pesa mucho menos.
name: Publicar versión

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# si se vuelve a subir la misma etiqueta, la ejecución anterior se cancela
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt ruff

      - name: Comprobar que la etiqueta coincide con version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) { throw "La etiqueta ($tag) no coincide con version.py ($ver): la actualización automática entraría en bucle" }

      - name: Revisar el código (ruff)
        run: |
          python -m compileall -q ui services config.py main.py version.py
          ruff check ui services config.py main.py version.py

      - name: Compilar
        run: python -m PyInstaller --noconfirm --distpath dist_app --workpath build_tmp Descargar_Musica.spec

      - name: Comprobar el programa compilado
        shell: pwsh
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          SELFTEST_SIN_FFMPEG: "1"
        run: |
          $p = Start-Process -FilePath "dist_app\Descargar_Musica\Descargar_Musica.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill($true); Write-Host "Tiempo agotado" }
          if (Test-Path "dist_app\Descargar_Musica\selftest.log") { Get-Content "dist_app\Descargar_Musica\selftest.log" }
          if ($p.ExitCode -ne 0) { throw "La autocomprobación falló" }
          Remove-Item "dist_app\Descargar_Musica\selftest.log"

      - name: Empaquetar
        shell: pwsh
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = "Descargar_Musica-v$ver-windows.zip"
          Compress-Archive -Path "dist_app\Descargar_Musica" -DestinationPath $zip
          # huella SHA-256 publicada junto al .zip: la aplicación la comprueba antes de actualizarse sola
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalador de Windows
        # si falla, la versión se publica igualmente con el .zip (que es lo que usa la actualización automática)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $path = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $path)) {
            choco install innosetup -y --no-progress
            $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $path "/DAppVersion=$env:VERSION" installer\Descargador.iss
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el instalador" }
          Move-Item "installer\Output\Descargador_Musica-Setup-v$env:VERSION.exe" .

      - name: Notas de esta versión
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?s)## $([regex]::Escape($env:VERSION))\r?\n(.*?)(\r?\n## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Versión $env:VERSION" }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Descargar_Musica-v${{ env.VERSION }}-windows.zip
            Descargar_Musica-v${{ env.VERSION }}-windows.zip.sha256
            Descargador_Musica-Setup-v${{ env.VERSION }}.exe
          body_path: release_notes.md
          name: Descargador de Música ${{ env.VERSION }}
